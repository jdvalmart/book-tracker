services:
  db:
    image: postgres:15
    container_name: booktracker-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: booktracker
    ports:
      - "5432:5432"
    volumes:
      - booktracker-data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: fastapi-backend
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/booktracker
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: react-frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  booktracker-data:
